# Проверки срабатывания скилла: запросы написаны как от пользователя, без названия скилла.
# should_trigger — скилл должен включиться; should_not_trigger — не должен.
meetflow:
  should_trigger:
    - "Вот расшифровка вчерашнего совещания, вытащи из неё поручения с исполнителями и сроками"
    - "Собери протокол по этой выгрузке из ВКС и обнови реестр задач"
    - "Модель приписала задачу не тому человеку — как сделать, чтобы спорные имена уходили на проверку?"
    - "Хочу завести новую тематику встреч для строительного участка: что заполнить?"
    - "Как настроить резервную модель, если локальный сервер упал посреди сборки протокола?"
    - "Проверь, готов ли наш инструмент протоколирования к запуску на реальных встречах"
    - "Extract action items with owners and due dates from this meeting transcript"
    - "Set up a meeting-minutes pipeline where the LLM proposes and code verifies against the transcript"
  should_not_trigger:
    - "Напиши SQL-запрос для отчёта по продажам за квартал"
    - "Сделай презентацию о нашей компании для новых сотрудников"
    - "Переведи это письмо на английский"
    - "Почини падающий тест в моём проекте на React"
    - "Составь повестку на следующую неделю для отдела маркетинга"
    - "Summarize this research paper in three bullet points"
