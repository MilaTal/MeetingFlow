<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetFlow</title>
  <link rel="stylesheet" href="styles.css?v=20261015undo">
</head>
<body>
<!-- вход по логину и паролю — как в Проекте ERP; показывается, только когда вход включён -->
<div id="login-screen" class="login-screen" hidden>
  <form class="card stack login-card" id="login-form">
    <h1 style="margin:0">Вход</h1>
    <label class="sub">Логин<input type="text" id="login-name" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label class="sub">Пароль<input type="password" id="login-password" autocomplete="current-password"></label>
    <div id="login-error" class="overdue" role="alert" hidden></div>
    <button class="btn btn-primary" type="submit">Войти</button>
  </form>
</div>
<div class="layout">
  <aside class="sidebar">
    <div class="brand"><span id="app-title">MeetFlow</span><small id="app-subtitle"></small></div>
    <nav class="nav" id="nav-main">
      <a class="main" href="#tasks" data-route="tasks">Реестр задач</a>
      <a class="main" href="#meetings" data-route="meetings">Встречи</a>
      <a class="main" href="#roadmap" data-route="roadmap">Дорожная карта</a>
      <a class="main" href="#search" data-route="search">Поиск по проекту</a>
    </nav>
    <div class="nav-sep"></div>
    <nav class="nav" id="nav-service">
      <a href="#team" data-route="team">Команда</a>
      <a href="#cards" data-route="cards" data-admin>Конфликты</a>
    </nav>
    <!-- служебные разделы супер-администратора — как в Проекте ERP (владелец 11.10.26) -->
    <div class="nav-sep" data-super></div>
    <nav class="nav" data-super>
      <a href="#system" data-route="system">Параметры системы<span id="awaiting-badge"></span></a>
      <a href="#live" data-route="live">Мониторинг RealTime</a>
      <a href="#models" data-route="models">Модели</a>
      <a href="#voices" data-route="voices">База голосов</a>
      <a href="#teamshared" data-route="teamshared">Общая команда</a>
      <a href="#design" data-route="design">Оформление</a>
    </nav>
    <div class="whoami">
      <label>Проект <select id="project"></select></label>
      <div id="test-identity">
        <label>Вы работаете как <select id="role"></select></label>
        <input id="username" placeholder="ФИО (для своих задач)">
      </div>
      <div id="auth-identity" class="sub" hidden></div>
      <button class="btn btn-ghost" id="mode-switch" type="button" data-super hidden></button>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"></main>
</div>
<script src="app.js?v=20261024team"></script>
</body>
</html>
